[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slicelab"
# Single-sourced from the package. Held as two literals, pyproject and
# `__init__`, they drift silently: the release workflow reads the version off
# the built dist filename, so a stale `__version__` publishes green while
# `slicelab --version` reports a number that was never released.
dynamic = ["version"]
description = "Reproducible control plane over the Slic3r-descended slicers: drive one, and record exactly what it resolved"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Cameron Brooks" }]
keywords = [
    "prusaslicer",
    "orcaslicer",
    "slicer",
    "gcode",
    "3d-printing",
    "fff",
    "reproducibility",
    "lockfile",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Zero runtime dependencies, by design. tomllib, hashlib, subprocess and
# argparse are stdlib on 3.11+. Adding one is org AGENTS.md section 10.
dependencies = []

[project.scripts]
slicelab = "slicelab.cli:_entrypoint"

[project.urls]
Homepage = "https://github.com/heibench/slicelab"
Repository = "https://github.com/heibench/slicelab"
Issues = "https://github.com/heibench/slicelab/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    # Pinned exactly, and equal to the `rev:` on ruff-pre-commit in
    # .pre-commit-config.yaml. A range here let the hook and `just lint` be two
    # different formatters -- they were five minors apart -- and the disagreement
    # surfaces as a CI failure nobody can reproduce locally.
    "ruff==0.16.6",
    "mypy>=1.10",
    # Dev-only, and only for `tests/test_pre_commit_gate.py`. That file asserts things
    # about nested YAML -- a `fetch-depth` under a `with` under one step of one job --
    # and an anchored regex over YAML passes or fails for the wrong reason the first
    # time somebody reformats the file. A gate that reports the wrong answer after a
    # reformat is the defect this repository exists to refuse, so the parser is worth
    # one dev dependency.
    "pyyaml>=6",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.version]
path = "slicelab/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["slicelab"]

# -- pytest -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: report the reason for every skip. A run that withholds the engine tests
# has to say so in the log, or the skip is indistinguishable from a pass.
# (org AGENTS.md 2.4 -- a skipped test is not a passing test)
addopts = ["-ra"]

# -- ruff ---------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# -- mypy ---------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
