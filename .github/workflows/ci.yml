name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked pull request is based on its parent branch, not
  # on main, and a base change fires `edited`, which is not a default activity
  # type -- so filtering on main means a retargeted PR gets no checks at all.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, because the `gitleaks (history)` hook scans it. The
          # default shallow clone gives it one commit, which it passes -- a check
          # handed nothing (org 2.4). This is the line that makes that hook mean
          # something.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Pinned, like ruff and the lockfile. An unpinned runner can change how hooks
      # resolve with no diff in this repository.
      - run: uvx pre-commit@4.2.0 run --all-files --show-diff-on-failure

      # Prove each hook CATCHES, one at a time.
      #
      # `tests/test_pre_commit_gate.py` reads this configuration, which keeps the
      # suite offline but pins presence rather than effect: `gitleaks git` swapped
      # for `gitleaks dir`, or `--maxkb` beside `--enforce-all`, leaves every
      # assertion there green and the hook blind. This job has network and already
      # runs the hooks, so it is the cheap place to close that.
      #
      # ONE HOOK PER INVOCATION. An earlier version planted all three defects and
      # read the aggregate exit code, which `pre-commit` sets to 1 if ANY hook
      # fails -- so blinding the history scan alone left the step printing "rejected
      # all three" and the job green. That is the defect this step exists to catch,
      # inside the step itself.
      - name: Each hook catches what it is named for
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          cp .pre-commit-config.yaml "$scratch/"
          cd "$scratch"
          git init -q -b main .
          git config user.email ci@example.invalid
          git config user.name CI

          head -c 2000000 /dev/urandom > big.bin
          printf 'a\n<<<<<<< HEAD\nb\n=======\nc\n>>>>>>> other\n' > conflicted.txt
          git add -A && git commit -q -m 'plant a large file and a conflict marker'

          # A secret that lives only in history, so the staged scan cannot see it.
          # gitleaks allowlists canonical example keys such as AKIAIOSFODNN7EXAMPLE,
          # and its aws-access-token rule wants AKIA plus exactly sixteen characters
          # from its alphabet -- a shorter tail is not a finding and the hook reports
          # clean, which is how the first version of this step passed for the wrong
          # reason. base32 emits A-Z2-7, which is already within that alphabet.
          key="AKIA$(head -c 20 /dev/urandom | base32 | tr -d = | head -c 16)"
          test ${#key} -eq 20 || { echo "::error::planted key is ${#key} chars, not 20; gitleaks will not flag it"; exit 1; }
          printf 'aws_access_key_id = %s\n' "$key" > creds.txt
          git add creds.txt && git commit -q -m 'plant a secret'
          git rm -q creds.txt && git commit -q -m 'delete it again'

          failures=0
          for pair in \
            'gitleaks-history:a secret that survives only in history' \
            'check-merge-conflict:a committed conflict marker' \
            'check-added-large-files:a 2 MB tracked file'
          do
            hook="${pair%%:*}"; what="${pair#*:}"
            if uvx pre-commit@4.2.0 run "$hook" --all-files; then
              echo "::error::$hook passed $what. That hook is decorative."
              failures=$((failures + 1))
            else
              echo "ok: $hook rejected $what"
            fi
          done
          test "$failures" -eq 0 || exit 1

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: just setup
      - run: just check

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          - python-version: "3.11"
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: just setup
      - run: just test

  # The engine matrix is engine.yml, not a job here: it installs a real slicer on
  # four host shapes and is scheduled rather than run per pull request. It sets
  # SLICELAB_REQUIRE_ENGINE=1, so a failed engine install is loud rather than a
  # silent skip. The jobs below run on hosts with no engine, where the
  # engine-dependent tests skip and `-ra` prints how many were withheld.

  ok:
    name: ok
    if: always()
    needs: [pre-commit, check, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Requires SUCCESS rather than testing for failure. `contains(needs.*.result,
      # 'failure')` does not match 'skipped', so an `if: false` on `check` or `test`
      # produced a fully green pull request with nothing checked -- measured in a
      # sibling repo, where that is exactly what happened.
      #
      # The tolerant form is right for a workflow with path filtering, where jobs
      # skip legitimately on a docs-only change. This one has none, so a skipped job
      # here is always a defect.
      #
      # Every job in `needs:` must also be named HERE. Listing a job in `needs:`
      # only makes `ok` wait for it -- the `if` is what makes it count. `pre-commit`
      # was added to one and not the other, so `ok` went green while a failing hook
      # sat red beside it, in the change whose subject was checks that cannot fail.
      # `needs['pre-commit']`, not `needs.pre-commit`: the hyphen needs the index
      # form and the dotted one is a syntax error.
      - name: Fail unless every upstream job succeeded
        if: >-
          needs['pre-commit'].result != 'success' ||
          needs.check.result != 'success' ||
          needs.test.result != 'success'
        run: exit 1
      - name: Pass
        run: echo 'All checks passed'
