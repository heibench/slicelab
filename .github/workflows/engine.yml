name: Engine

# The real engines, across the ways people actually install them.
#
# ci.yml runs the suite everywhere and SKIPS the engine tests, because no
# standard runner has a slicer. That leaves discovery -- the thing `which`
# exists to do -- covered by fake launchers alone. Fakes are exactly what would
# hide the finding this verb was written for: PrusaSlicer's Flathub entrypoint
# backgrounds its child and therefore returns 0 for every invocation, so its
# exit status carries no information (notes/evidence.md V10).
#
# Every job sets SLICELAB_REQUIRE_ENGINE=1, so a failed install is a LOUD
# failure rather than a green run full of skips. A job that could not get an
# engine must not look like a job that tested one.
#
# THIS MATRIX IS ALSO A CONTROL. Every empirical finding behind this project
# was taken on one Linux host against two Flatpaks. A Flatpak is a materially
# different execution environment -- sandboxed filesystem, its own /tmp,
# translated paths -- so behaviour observed only there is not established for
# native builds. The macOS and Windows jobs run the same code against native
# 2.9.6, which is the only control available: PrusaSlicer publishes no Linux
# asset on its GitHub releases (checked across 2.9.6 and the four before it --
# only setup.exe, .dmg and a Windows .zip), and Debian/Ubuntu ship 2.9.2, a
# different version.
#
# Not on every push: these install large GUI applications and are slower and
# more fragile than the gate. On demand, and weekly so upstream packaging
# changes surface without anyone remembering to look.

on:
  workflow_dispatch:
  # On the PRs that can break it, not only weekly. #37 landed green on the gate,
  # broke all four legs here, and the first run that said so was the schedule six
  # days later -- after which it stayed red for a month because nobody was looking
  # at a workflow nothing reports on. The paths filter is what keeps that cheap.
  pull_request:
    paths:
      - "slicelab/**"
      - "tests/*_against_the_engine.py"
      - "scripts/seed_engine_config.py"
      - ".github/workflows/engine.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

env:
  SLICELAB_REQUIRE_ENGINE: "1"

jobs:
  flatpak:
    name: Linux / Flatpak (Flathub, both engines)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install both engines from Flathub
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub com.prusa3d.PrusaSlicer
          sudo flatpak install -y --noninteractive flathub com.orcaslicer.OrcaSlicer
      - name: Show what was installed
        run: flatpak list --app
      - name: Give the engine a writable runtime directory
        # Without one the Flatpak launcher cannot create `/run/user/<uid>/dconf/user`
        # and the engine prefixes stderr with `dconf-CRITICAL **: ... Permission
        # denied. dconf will not work properly.` -- measured on run 38497422988, where
        # six tests that assert a clean run writes nothing on stderr failed on it.
        #
        # The environment is the fix rather than those assertions: "this engine says
        # nothing when it succeeds" is a property worth keeping pinned, and a message
        # the launcher invented is not the engine saying something. 0700 is what the
        # basedir spec requires of this directory.
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - run: just setup
      - name: Give both engines the configuration their verbs need
      # A fresh install has NO configuration, and D29 makes that an environment
        # fault: the verbs refuse at exit 4 rather than ask an unconfigured engine
        # to dump a configuration it has not got. Every leg here installed an engine
        # and configured none, so every engine-backed test failed from the first run
        # after #37 (#43).
        #
        # Running the engine once does not fix it, which is the thing #43 left open.
        # Measured against Flathub 2.9.6: `--help` with a fresh datadir exits 0 and
        # creates nothing, and a real `--export-gcode` refuses with "Configuration
        # wasn't found. Check your 'datadir' value." and writes no G-code. So the
        # configuration is seeded from the bundles the install already ships.
        run: |
          set -euo pipefail
          prusa=$(flatpak info --show-location com.prusa3d.PrusaSlicer)
          uv run python scripts/seed_engine_config.py prusaslicer \
            --profiles "$prusa/files/share/PrusaSlicer/profiles" \
            --datadir "$HOME/.var/app/com.prusa3d.PrusaSlicer/config/PrusaSlicer"
          orca=$(flatpak info --show-location com.orcaslicer.OrcaSlicer)
          uv run python scripts/seed_engine_config.py orcaslicer \
            --profiles "$orca/files/share/OrcaSlicer/profiles" \
            --datadir "$HOME/.var/app/com.orcaslicer.OrcaSlicer/config/OrcaSlicer"
      - run: just test
      - name: Report what discovery chose, and why
        # The interesting output of this whole workflow. On the development
        # host PrusaSlicer's default entrypoint is REJECTED for returning 0 and
        # the --command= bypass wins, while OrcaSlicer keeps its entrypoint
        # (which carries the packager's LC_NUMERIC=C fix). If a Flathub update
        # ever changes either, this is where it surfaces.
        run: uv run slicelab which

  linux-apt:
    name: Linux / distro package on PATH
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install PrusaSlicer from the distro archive
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y prusa-slicer
          command -v prusa-slicer
      - name: Give the engine a writable runtime directory
        # Without one the Flatpak launcher cannot create `/run/user/<uid>/dconf/user`
        # and the engine prefixes stderr with `dconf-CRITICAL **: ... Permission
        # denied. dconf will not work properly.` -- measured on run 38497422988, where
        # six tests that assert a clean run writes nothing on stderr failed on it.
        #
        # The environment is the fix rather than those assertions: "this engine says
        # nothing when it succeeds" is a property worth keeping pinned, and a message
        # the launcher invented is not the engine saying something. 0700 is what the
        # basedir spec requires of this directory.
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/xdg-runtime"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
      - run: just setup
      - name: Give the engine the configuration its verbs need
        run: |
          set -euo pipefail
          ls /usr/share/PrusaSlicer/profiles | head
          uv run python scripts/seed_engine_config.py prusaslicer \
            --profiles /usr/share/PrusaSlicer/profiles \
            --datadir "$HOME/.config/PrusaSlicer"
      - name: Discovery and enumeration only, which is what this leg controls for
        # Ubuntu ships 2.9.2 and the resolve/slice suite asks for 2.9.6's option
        # spellings, so those tests cannot pass here: `Unknown option
        # --printer-profile`, 29 failures on run 38267940432 (#50). The option is
        # real on 2.9.6 -- checked against the Flathub build -- so the gap is the
        # version, not the argv.
        #
        # This leg's stated job is plain PATH discovery with no sandbox, which is
        # coverage the Flatpak legs cannot give. It now runs exactly that, rather
        # than failing at something it was never controlling for. The rest of the
        # suite is not lost: ci.yml runs it on Linux on every push.
        run: uv run pytest tests/test_discovery.py tests/test_presets.py
      - name: Report what discovery chose, and why
        run: uv run slicelab which prusaslicer

  macos:
    name: macOS / Homebrew cask (.app bundle)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install PrusaSlicer
        run: |
          set -euo pipefail
          brew install --cask prusaslicer
          ls -d /Applications/*rusa* || true
      - name: Put the bundle's binary on PATH, and record what it is called
        # A macOS .app is a directory, so installing the cask puts nothing on
        # PATH. The binary inside carries the APPLICATION's name, not the
        # command's -- discovery looking only for the POSIX name reported the
        # engine absent on a runner that had just installed it. The listing is
        # not decoration: the bundle's executable name is a packaging decision
        # that can change, and this is where we would see it change.
        run: |
          set -euo pipefail
          bundle=$(ls -d /Applications/*rusa*.app | head -1)
          echo "executables in $bundle/Contents/MacOS:"
          ls -l "$bundle/Contents/MacOS"
          echo "$bundle/Contents/MacOS" >> "$GITHUB_PATH"
      - run: just setup
      - name: Give the engine the configuration its verbs need
      # A fresh install has NO configuration, and D29 makes that an environment
        # fault: the verbs refuse at exit 4 rather than ask an unconfigured engine
        # to dump a configuration it has not got. Every leg here installed an engine
        # and configured none, so every engine-backed test failed from the first run
        # after #37 (#43).
        #
        # Running the engine once does not fix it, which is the thing #43 left open.
        # Measured against Flathub 2.9.6: `--help` with a fresh datadir exits 0 and
        # creates nothing, and a real `--export-gcode` refuses with "Configuration
        # wasn't found. Check your 'datadir' value." and writes no G-code. So the
        # configuration is seeded from the bundles the install already ships.
        #
        # The datadir is the one the engine named itself in the failing run:
        # `Failed to load data from the datadir
        # '/Users/runner/Library/Application Support/PrusaSlicer'`. slicelab
        # declares no macOS location, so D29 cannot refuse here and the engine
        # fails with that message instead -- the seed is for the engine's sake.
        run: |
          set -euo pipefail
          bundle=$(ls -d /Applications/*rusa*.app | head -1)
          ls "$bundle/Contents/Resources" | head
          uv run python scripts/seed_engine_config.py prusaslicer \
            --profiles "$bundle/Contents/Resources/profiles" \
            --datadir "$HOME/Library/Application Support/PrusaSlicer"
      - run: just test
      - name: Report what discovery chose, and why
        run: uv run slicelab which prusaslicer

  windows:
    name: Windows / official portable zip
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install PrusaSlicer from the official portable zip
        # The one native build of the EXACT version this project's findings
        # were taken against (2.9.6). Windows is where the Flatpak-versus-
        # native control actually lands.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/prusa3d/PrusaSlicer/releases/download/version_2.9.6/PrusaSlicer-2.9.6.zip"
          Invoke-WebRequest -Uri $url -OutFile prusaslicer.zip
          Expand-Archive prusaslicer.zip -DestinationPath $env:RUNNER_TEMP\prusaslicer
          $exe = Get-ChildItem -Recurse -Filter prusa-slicer-console.exe $env:RUNNER_TEMP\prusaslicer |
                 Select-Object -First 1
          if (-not $exe) { throw "prusa-slicer-console.exe not found in the portable zip" }
          Add-Content -Path $env:GITHUB_PATH -Value $exe.Directory.FullName
      - run: just setup
      - name: Give the engine the configuration its verbs need
      # A fresh install has NO configuration, and D29 makes that an environment
        # fault: the verbs refuse at exit 4 rather than ask an unconfigured engine
        # to dump a configuration it has not got. Every leg here installed an engine
        # and configured none, so every engine-backed test failed from the first run
        # after #37 (#43).
        #
        # Running the engine once does not fix it, which is the thing #43 left open.
        # Measured against Flathub 2.9.6: `--help` with a fresh datadir exits 0 and
        # creates nothing, and a real `--export-gcode` refuses with "Configuration
        # wasn't found. Check your 'datadir' value." and writes no G-code. So the
        # configuration is seeded from the bundles the install already ships.
        #
        # The datadir is the one the engine named itself in the failing run:
        # `Failed to load data from the datadir
        # 'C:\Users\runneradmin\AppData\Roaming\PrusaSlicer'`, which is
        # %APPDATA%\PrusaSlicer.
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem -Recurse -Filter prusa-slicer-console.exe $env:RUNNER_TEMP\prusaslicer |
                 Select-Object -First 1
          $profiles = Join-Path $exe.Directory.FullName "resources\profiles"
          Get-ChildItem $profiles | Select-Object -First 5 -ExpandProperty Name
          uv run python scripts/seed_engine_config.py prusaslicer `
            --profiles "$profiles" `
            --datadir "$env:APPDATA\PrusaSlicer"
      - run: just test
      - name: Report what discovery chose, and why
        run: uv run slicelab which prusaslicer
