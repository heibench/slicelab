# Verified by planting what each hook is named for and watching it fail. Three of
# these passed on inputs they were added to reject; see tests/test_pre_commit_gate.py,
# which is what keeps that from happening again.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.27.2
    hooks:
      # The staged index -- what a developer's commit actually contains.
      - id: gitleaks
        # Aliased for the same reason the history scan is: both hooks have the id
        # `gitleaks`, so `pre-commit run gitleaks` runs the pair and the aggregate
        # exit code cannot say which fired. With an alias each can be run alone and
        # required to reject a secret planted where that hook is supposed to look.
        alias: gitleaks-staged
        name: gitleaks (staged)
      # And the history. The hook above runs `gitleaks git --staged`, so on a fresh
      # checkout -- which is every CI run -- nothing is staged and it reads zero
      # bytes and passes. A check that was handed nothing is not a check (org 2.4),
      # so the pair is not two scans: this one is what CI depends on, and the staged
      # hook earns its place at commit time. Both are proved by effect, each against
      # a secret planted where that hook is supposed to look.
      # Needs `fetch-depth: 0`, or there is no history here to scan.
      - id: gitleaks
        # An alias, so CI can run this hook ALONE and require it to reject a planted
        # secret. Without one, `pre-commit run gitleaks` runs both gitleaks hooks and
        # the aggregate exit code cannot say which of them fired.
        alias: gitleaks-history
        name: gitleaks (history)
        entry: gitleaks git --redact --verbose
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      # Without `--assume-in-merge` this declines to look unless a merge is actually
      # in progress, so a committed conflict marker passes forever.
      - id: check-merge-conflict
        args: [--assume-in-merge]
      # Without `--enforce-all` this inspects only files added in THIS commit, so a
      # large file already tracked is never seen again.
      - id: check-added-large-files
        args: [--enforce-all]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must equal the `ruff==` pin in pyproject.toml's dev group; the hook and
    # `just lint` are otherwise free to be two different formatters, and the
    # disagreement surfaces as a CI failure nobody can reproduce locally.
    # `tests/test_pre_commit_gate.py` asserts they match.
    rev: v0.16.6
    hooks:
      # `ruff`, not `ruff-check`, is the deprecated alias -- it still resolves and
      # prints "ruff (legacy alias)" on every run.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
